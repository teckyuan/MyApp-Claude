<div class="card narrow">
  <h1>Create account</h1>
  @if (errors().length) {
    <div class="alert" role="alert">
      <ul>
        @for (e of errors(); track e) {
          <li>{{ e }}</li>
        }
      </ul>
    </div>
  }
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" formControlName="email" autocomplete="username" />
    </div>
    <div class="field">
      <label for="password">Password (at least 12 characters)</label>
      <input id="password" type="password" formControlName="password" autocomplete="new-password" />
      @if (form.controls.password.touched && form.controls.password.hasError('minlength')) {
        <div class="field-error">Password must be at least 12 characters.</div>
      }
    </div>
    <button class="primary" type="submit" [disabled]="form.invalid || busy()">
      {{ busy() ? 'Creating…' : 'Register' }}
    </button>
  </form>
  <p class="muted">Already registered? <a routerLink="/login">Log in</a></p>
</div>
