<h2 mat-dialog-title>{{ product ? 'Edit product #' + product.id : 'New product' }}</h2>
<form [formGroup]="form" (ngSubmit)="save()">
  <mat-dialog-content>
    @if (errors().length) {
      <div class="alert" role="alert">
        <ul>
          @for (e of errors(); track e) {
            <li>{{ e }}</li>
          }
        </ul>
      </div>
    }
    <mat-form-field class="full">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name" maxlength="200" required cdkFocusInitial />
      <mat-error>Name is required.</mat-error>
    </mat-form-field>
    <mat-form-field class="full">
      <mat-label>Price</mat-label>
      <input matInput type="number" step="0.01" min="0" formControlName="price" required />
      <mat-error>Enter a price of zero or more.</mat-error>
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-stroked-button type="button" mat-dialog-close [disabled]="saving()">Cancel</button>
    <button mat-flat-button type="submit" [disabled]="form.invalid || saving()">
      {{ product ? 'Save' : 'Add' }}
    </button>
  </mat-dialog-actions>
</form>
